name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Dépendances
        run: npm ci

      - name: Copie du site dans le projet Android
        run: npx cap sync android

      - name: Compilation de l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          VERSION=$(node -p "require('../package.json').version")
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName=$VERSION

      - name: Publication de la version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION-build${{ github.run_number }}"
          cp android/app/build/outputs/apk/release/app-release.apk mtg-table.apk
          gh release create "$TAG" mtg-table.apk \
            --title "MTG Table $VERSION (build ${{ github.run_number }})" \
            --notes "Commit ${{ github.sha }}. Ouvre cette page sur ton téléphone et télécharge mtg-table.apk." \
            --latest
